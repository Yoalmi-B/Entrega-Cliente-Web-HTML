
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Formulario CRUD</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5" id="informacion">

    <div class="card shadow">

        <h3 class="card-header">
            Gestión de Usuarios
        </h3>

        <div class="card-body">

            <h5 class="card-title">
                Formulario CRUD de Personas
            </h5>

            <p class="card-text">
                Registra, consulta, actualiza y elimina personas.
            </p>

            <form onsubmit="return false;">

                <div class="row">

                    <div class="col-md-8 mb-3">

                        <input type="text"
                               class="form-control"
                               id="documento"
                               placeholder="Documento">

                    </div>

                    <div class="col-md-4 mb-3">

                        <button type="button"
                                class="btn btn-primary w-100"
                                onclick="buscarPersona()">
                            Buscar
                        </button>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <input type="text"
                               class="form-control"
                               id="nombre"
                               placeholder="Nombre">

                    </div>

                    <div class="col-md-4 mb-3">

                        <input type="text"
                               class="form-control"
                               id="telefono"
                               placeholder="Teléfono">

                    </div>

                    <div class="col-md-4 mb-3">

                        <input type="number"
                               class="form-control"
                               id="edad"
                               placeholder="Edad"
                               min="1">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <input type="text"
                               class="form-control"
                               id="profesion"
                               placeholder="Profesión">

                    </div>

                    <div class="col-md-4 mb-3">

                        <input type="password"
                               class="form-control"
                               id="password"
                               placeholder="Contraseña">

                    </div>

                    <div class="col-md-4 mb-3">

                        <select class="form-select" id="tipo">

                            <option value="">Seleccionar tipo</option>

                            <option value="1">Admin</option>

                            <option value="2">Usuario</option>

                            <option value="3">Invitado</option>

                        </select>

                    </div>

                </div>

                <div class="row g-2 justify-content-end">

                    <div class="col-md-auto">

                        <button type="button"
                                class="btn btn-primary"
                                onclick="registrarPersona()">
                            Registrar
                        </button>

                    </div>

                    <div class="col-md-auto">

                        <button type="button"
                                class="btn btn-success"
                                onclick="actualizarPersona()">
                            Actualizar
                        </button>

                    </div>

                    <div class="col-md-auto">

                        <button type="button"
                                class="btn btn-danger"
                                onclick="eliminarPersona()">
                            Eliminar
                        </button>

                    </div>

                    <div class="col-md-auto">

                        <button type="button"
                                class="btn btn-secondary"
                                onclick="consultarProfesion()">
                            Consultar profesión
                        </button>

                    </div>

                    <div class="col-md-auto">

                        <button type="button"
                                class="btn btn-dark"
                                onclick="limpiarFormulario()">
                            Limpiar
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

    <!-- Tabla de personas -->

    <div class="card mt-4 shadow">

        <div class="card-header d-flex justify-content-between align-items-center">

            <h5 class="mb-0">Personas registradas</h5>

            <button type="button"
                    class="btn btn-primary btn-sm"
                    onclick="obtenerListaPersonas()">
                Consultar lista
            </button>

        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped table-bordered">

                    <thead class="table-dark">

                        <tr>
                            <th>Documento</th>
                            <th>Nombre</th>
                            <th>Teléfono</th>
                            <th>Edad</th>
                            <th>Profesión</th>
                            <th>Tipo</th>
                        </tr>

                    </thead>

                    <tbody id="listaPersonas">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="cliente.js"></script>

</body>

</html>
